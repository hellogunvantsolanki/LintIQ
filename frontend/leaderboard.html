<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LintIQ Global Leaderboard</title>
  <meta name="description" content="Live global rankings of top LintIQ bug hunters ranked by Arcade Score, streak, and Surgical Patch precision." />

  <!-- Open Graph & Twitter / X Preview -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://thelintiq.com/leaderboard.html" />
  <meta property="og:title" content="LintIQ Global Leaderboard – Top Bug Hunters" />
  <meta property="og:description" content="See where you rank among developers hunting real production bugs on LintIQ." />
  <meta property="og:image" content="https://thelintiq.com/assets/og-card.png" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="LintIQ Global Leaderboard – Top Bug Hunters" />
  <meta name="twitter:description" content="See where you rank among developers hunting real production bugs on LintIQ." />
  <meta name="twitter:image" content="https://thelintiq.com/assets/og-card.png" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <script src="js/tailwind-config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="style.css" />
  <style>
    html, body {
      min-height: 100vh;
      background-color: #090b0f;
      color: #e2e8f0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      font-feature-settings: "cv02", "cv03", "cv04", "cv11";
    }
  </style>
</head>
<body class="flex flex-col min-h-screen antialiased">

  <!-- SHARED NAVBAR -->
  <nav id="lintiq-navbar" data-page="leaderboard"></nav>

  <main class="flex-1 w-full max-w-[1680px] mx-auto px-4 sm:px-6 lg:px-8 xl:px-10 py-6 space-y-6">
    <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
      <div>
        <h1 class="text-xl sm:text-2xl font-semibold tracking-[-0.02em] text-white">Leaderboard</h1>
        <p id="lb-season-info" class="text-sm font-normal text-zinc-400 mt-1">Loading leaderboard data...</p>
      </div>
    </div>

    <!-- YOUR RANK HIGHLIGHT BAR (dynamic) -->
    <div id="lb-user-rank-bar" class="hidden bg-surface border border-white/[0.08] rounded-xl p-5 flex flex-col md:flex-row md:items-center justify-between gap-4">
      <!-- Populated by leaderboard.js -->
    </div>

    <!-- PODIUM (dynamic) -->
    <div id="lb-podium" class="grid grid-cols-1 md:grid-cols-3 gap-4 lg:gap-6">
      <div class="md:col-span-3 py-12 text-center text-zinc-400 text-xs">Loading top engineers...</div>
    </div>

    <!-- FULL RANKINGS TABLE -->
    <div class="bg-surface border border-white/[0.07] rounded-xl overflow-hidden">
      <div class="px-6 py-4 border-b border-white/[0.07] flex items-center justify-between">
        <span class="font-semibold text-white text-base tracking-[-0.02em]">Full Rankings</span>
        <button id="lb-refresh-btn" onclick="loadLeaderboardPage()" class="text-xs font-medium text-zinc-300 hover:text-white transition cursor-pointer">Refresh</button>
      </div>
      <div class="overflow-x-auto">
        <table class="w-full text-left text-[13px]">
          <thead class="bg-white/[0.02] text-zinc-400 text-xs font-medium border-b border-white/[0.07]">
            <tr><th class="py-3 px-4 w-14 font-medium">Rank</th><th class="py-3 px-4 font-medium">Engineer</th><th class="py-3 px-4 text-right font-medium">Score</th><th class="py-3 px-4 text-center font-medium">Streak</th><th class="py-3 px-4 text-right font-medium">Bugs Solved</th></tr>
          </thead>
          <tbody id="lb-full-rows" class="divide-y divide-white/[0.06] text-zinc-300">
            <tr><td colspan="5" class="py-12 text-center text-zinc-400 text-xs">Loading...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <footer class="h-8 bg-surface-dim border-t border-white/[0.06] px-6 flex items-center justify-between text-xs text-zinc-500 shrink-0 mt-auto">
    <div>LintIQ</div>
    <div>Leaderboard</div>
  </footer>

  <!-- INJECTED COMPONENTS -->
  <div id="lintiq-auth-modal"></div>

  <!-- Shared JS -->
  <script src="js/shared.js"></script>
  <script src="components/navbar.js"></script>
  <script src="components/auth-modal.js"></script>

  <!-- Leaderboard Logic -->
  <script src="js/leaderboard.js"></script>
</body>
</html>
