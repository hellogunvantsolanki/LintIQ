<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LintIQ Global Leaderboard</title>
  <meta name="description" content="Live global rankings of top LintIQ bug hunters ranked by Arcade Score, streak, and Surgical Patch precision." />

  <!-- Open Graph & Twitter / X Preview -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://thelintiq.com/leaderboard.html" />
  <meta property="og:title" content="LintIQ Global Leaderboard – Top Bug Hunters" />
  <meta property="og:description" content="See where you rank among developers hunting real production bugs on LintIQ." />
  <meta property="og:image" content="https://thelintiq.com/assets/og-card.png" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="LintIQ Global Leaderboard – Top Bug Hunters" />
  <meta name="twitter:description" content="See where you rank among developers hunting real production bugs on LintIQ." />
  <meta name="twitter:image" content="https://thelintiq.com/assets/og-card.png" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <script src="js/tailwind-config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    html, body { min-height: 100vh; background-color: #0a0e16; color: #e2e8f0; font-family: 'Geist', sans-serif; }
  </style>
</head>
<body class="flex flex-col min-h-screen antialiased">

  <!-- SHARED NAVBAR -->
  <nav id="lintiq-navbar" data-page="leaderboard"></nav>

  <main class="flex-1 w-full max-w-[1680px] mx-auto px-4 sm:px-6 lg:px-8 xl:px-10 py-5 lg:py-6 space-y-6">
    <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
      <div>
        <div class="text-[10px] uppercase font-mono tracking-widest text-emerald-400 flex items-center gap-2">
          <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
          Live Competition • Arcade Ladder
        </div>
        <h1 class="text-2xl font-bold text-white mt-1">Global Arcade Leaderboard & Competitions</h1>
        <p id="lb-season-info" class="text-xs text-gray-400 mt-1">Loading leaderboard data...</p>
      </div>
    </div>

    <!-- YOUR RANK HIGHLIGHT BAR (dynamic) -->
    <div id="lb-user-rank-bar" class="hidden bg-surface border border-emerald-500/30 rounded-xl p-4 flex flex-col md:flex-row md:items-center justify-between gap-4 shadow-xl">
      <!-- Populated by leaderboard.js -->
    </div>

    <!-- PODIUM (dynamic) -->
    <div id="lb-podium" class="grid grid-cols-1 md:grid-cols-3 gap-4 lg:gap-6">
      <div class="md:col-span-3 py-12 text-center text-gray-400 font-mono">Loading top bug hunters...</div>
    </div>

    <!-- FULL RANKINGS TABLE -->
    <div class="bg-surface border border-surface-border rounded-xl overflow-hidden shadow-xl">
      <div class="px-5 py-3.5 border-b border-surface-border flex items-center justify-between">
        <span class="font-bold text-white text-sm">Full Rankings</span>
        <button id="lb-refresh-btn" onclick="loadLeaderboardPage()" class="text-xs text-emerald-400 hover:underline cursor-pointer font-mono">Refresh</button>
      </div>
      <div class="overflow-x-auto">
        <table class="w-full text-left text-xs">
          <thead class="bg-surface-container/60 text-gray-400 uppercase tracking-wider text-[10px] font-mono border-b border-surface-border">
            <tr><th class="py-3 px-4 w-14">#</th><th class="py-3 px-4">Engineer</th><th class="py-3 px-4 text-right">Score</th><th class="py-3 px-4 text-center">Streak</th><th class="py-3 px-4 text-right">Bugs Solved</th></tr>
          </thead>
          <tbody id="lb-full-rows" class="divide-y divide-surface-border/50 text-gray-300">
            <tr><td colspan="5" class="py-12 text-center text-gray-400 font-mono">Loading...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <footer class="h-8 bg-surface-dim border-t border-surface-border/50 px-6 flex items-center justify-between text-[11px] text-gray-500 shrink-0 mt-auto">
    <div>LintIQ IDE • ARCADE V1.6</div>
    <div class="font-mono">Cloud Leaderboard</div>
  </footer>

  <!-- INJECTED COMPONENTS -->
  <div id="lintiq-auth-modal"></div>

  <!-- Shared JS -->
  <script src="js/shared.js"></script>
  <script src="components/navbar.js"></script>
  <script src="components/auth-modal.js"></script>

  <!-- Leaderboard Logic -->
  <script src="js/leaderboard.js"></script>
</body>
</html>
